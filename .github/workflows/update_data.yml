
name: Update Market Data

on:
  schedule:
    # Beijing Time (UTC+8): 08:30 and 17:00
    # UTC: 00:30 and 09:00
    - cron: '30 0 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run update scripts
        run: |
          python update_news.py

      - name: Commit and push changes
        id: commit
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # Pull latest changes to avoid conflicts
          git pull --rebase origin main || echo "No remote changes to pull"
          git add market_data.json marquee_data.json news_data.json ipo_data.json ma_data.json
          
          # Check for changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "pushed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Automated market data update"
            git push
            echo "pushed=true" >> $GITHUB_OUTPUT
          fi

      - name: Send Telegram Notification
        if: success() && steps.commit.outputs.pushed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage \
              -d chat_id=$TELEGRAM_CHAT_ID \
              -d text="Daily Financial Report has been updated: https://yumumu-liu.github.io/Daily-Financial-Report/"
          else
            echo "Telegram secrets not set, skipping notification."
          fi
